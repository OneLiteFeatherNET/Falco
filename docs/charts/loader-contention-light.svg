<svg xmlns="http://www.w3.org/2000/svg" width="688" height="254" viewBox="0 0 688 254" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="688" height="254" fill="#fcfcfb"/>
<text x="20" y="27" font-size="14" font-weight="600" fill="#1a1a19">Reading a chunk, as threads are added</text>
<text x="20" y="46" font-size="11.5" fill="#5c5b55">RegionFileComparisonBenchmark, 200 distinct block states, Minestom time ÷ Falco time</text>
<rect x="20" y="56" width="9" height="9" rx="2" fill="#2a78d6"/>
<text x="34" y="64" font-size="11.5" fill="#5c5b55">Falco faster</text>
<rect x="131.2" y="56" width="9" height="9" rx="2" fill="#eb6834"/>
<text x="145.2" y="64" font-size="11.5" fill="#5c5b55">Minestom faster</text>
<line x1="212" y1="68" x2="212" y2="200" stroke="#e4e3df" stroke-width="2"/>
<text x="212" y="216" font-size="10.5" text-anchor="middle" fill="#5c5b55">1.0× — level</text>
<text x="88" y="97" font-size="11.5" text-anchor="end" fill="#1a1a19">1 thread</text>
<rect x="205.1" y="78" width="6.9" height="30" rx="4" fill="#eb6834"/>
<text x="197.1" y="97" font-size="11.5" font-weight="600" text-anchor="end" fill="#1a1a19">1.14× slower</text>
<text x="88" y="141" font-size="11.5" text-anchor="end" fill="#1a1a19">2 threads</text>
<rect x="212.0" y="122" width="44.1" height="30" rx="4" fill="#2a78d6"/>
<text x="264.1" y="141" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a1a19">1.86× faster</text>
<text x="88" y="185" font-size="11.5" text-anchor="end" fill="#1a1a19">4 threads</text>
<rect x="212.0" y="166" width="358.0" height="30" rx="4" fill="#2a78d6"/>
<text x="578.0" y="185" font-size="11.5" font-weight="600" text-anchor="start" fill="#1a1a19">8.00× faster</text>
<text x="20" y="240" font-size="10.5" fill="#5c5b55">Single-threaded Falco is behind. The lock granularity only pays once threads compete — which is the case a server is in.</text>
</svg>
