name: "Data loss or world corruption"
description: "Blocks, chunks or region files were lost, changed or became unreadable"
title: "[Data loss] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Stop the server and keep a copy of the affected `region/` directory before you do anything
        else.** Falco throws on a failed read rather than reporting the chunk as absent, precisely so
        that the server does not regenerate over real data — but a restart under a different loader
        can still overwrite the evidence.

        Some data is knowingly not preserved yet. Check the wiki's Project Status page under **Known
        deviations from vanilla** before filing; the current gaps are heightmaps, unknown chunk-level tags
        (`structures`, `block_ticks`, `fluid_ticks`, …), `entities/`, `poi/`, `level.dat`, LZ4
        (`region-file-compression=lz4`) and corruption recovery for a damaged header.
  - type: dropdown
    id: symptom
    attributes:
      label: "What happened to the data?"
      options:
        - "A chunk came back empty or freshly generated"
        - "Blocks were missing or wrong after a restart"
        - "A region file became unreadable"
        - "Block entities or block handlers were lost"
        - "Biomes were lost or replaced"
        - "Light was wrong and stayed wrong"
        - "The world is no longer readable by vanilla or another loader"
        - "Something else"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "What was lost, and how did you notice?"
      description: "Coordinates, the region file name (`r.X.Z.mca`), and how the loss was confirmed — in game, with an NBT viewer, by a diff against a backup."
    validations:
      required: true
  - type: input
    id: world-origin-version
    attributes:
      label: "Which Minecraft version created this world?"
      description: "The version the world data was originally written by, not the version your server reports. Anvil details differ between versions and this is often the whole answer."
      placeholder: "e.g. 1.21.4, or \"unknown, the world is old\""
    validations:
      required: true
  - type: dropdown
    id: world-origin
    attributes:
      label: "Where does the world come from?"
      options:
        - "A vanilla client or vanilla server"
        - "Generated by Minestom"
        - "Written by Falco itself"
        - "Another server implementation (Paper, Spigot, Fabric, …)"
        - "A world editor or converter (WorldEdit, Amulet, MCASelector, …)"
        - "Unknown"
    validations:
      required: true
  - type: dropdown
    id: compression
    attributes:
      label: "Region file compression"
      description: "From `server.properties` of whatever wrote the world. Falco supports zlib, gzip and uncompressed plus external `.mcc` chunks; it does not read LZ4 (type 4) or custom (type 127)."
      options:
        - "zlib (the default)"
        - "gzip"
        - "none / uncompressed"
        - "lz4"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce"
      description: "What the server was doing when it happened — start-up load, autosave, shutdown, a player editing chunks, a bulk `saveChunks`."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: "How reproducible is it?"
      options:
        - "Every time"
        - "Often, but not every time"
        - "Rarely — seen a handful of times"
        - "Once, and I have not reproduced it since"
    validations:
      required: true
  - type: input
    id: threads
    attributes:
      label: "How many threads were using the loader at the time?"
      description: "Minestom starts one virtual thread per chunk when `supportsParallelLoading()` is true, so loads are usually concurrent. Say `1` only if you drove the loader yourself from a single thread."
      placeholder: "e.g. 8, or \"unknown — Minestom drove the loads\""
    validations:
      required: true
  - type: input
    id: cores
    attributes:
      label: "Available processors"
      description: "The output of `Runtime.getRuntime().availableProcessors()` on the affected machine."
      placeholder: "e.g. 16"
    validations:
      required: true
  - type: input
    id: falco-version
    attributes:
      label: "Falco version"
      placeholder: "e.g. 0.2.1"
    validations:
      required: true
  - type: input
    id: minestom-version
    attributes:
      label: "Minestom version"
      description: "Minestom is `compileOnly`, so the version is yours to choose and is not implied by the Falco version."
      placeholder: "e.g. 2026.06.20-26.1.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "Operating system"
      description: "Include the version. File renaming and deletion differ on Windows, and the external `.mcc` path has already produced a Windows-only defect."
      placeholder: "e.g. Windows Server 2022, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Stack trace and logs"
      description: "Any `AnvilChunkException`, `ClosedChannelException`, `NoSuchFileException` or `IllegalStateException` around the time of the loss, with the full stack trace."
      render: text
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: "Before submitting"
      options:
        - label: "I read the \"Known deviations from vanilla\" section of the wiki's Project Status page and this is not one of them."
          required: true
        - label: "I still have the affected region files, or a backup of them, in case a maintainer asks for a sample."
        - label: "I searched the existing issues and did not find this already reported."
          required: true
