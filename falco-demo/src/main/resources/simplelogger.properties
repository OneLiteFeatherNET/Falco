# The demo prints a report, not a log. Minestom logs the whole registry start at info level and the
# loader announces every region directory it opens, which would bury the result under lines nobody
# reads. Warnings and errors still come through, because a warning during a measurement is exactly
# the thing that explains a strange number.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showDateTime=false
