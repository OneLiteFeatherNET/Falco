# Deliberately accepted breaks of binary compatibility.
#
# Every entry here switches off the japicmp check for one type, which means nothing about that type
# is compared any more -- not the break named below and not any further break that lands later. An
# entry is therefore a debt, not a decision that stays true. The `baseline` key below binds the whole
# file to the released version the exceptions were judged against; the build fails if it drifts from
# `apiBaselineVersion` in gradle.properties. That failure is the point: after the next release
# somebody has to look at each entry again and delete the ones the new baseline has absorbed.
#
# Format: <module-name>.classExcludes = <fully qualified type>[, <type>...]

baseline = 0.3.0

# net.onelitefeather.falco.light.FalcoLightingChunk
#
# The class became `final` and now extends net.onelitefeather.falco.instance.FalcoChunk instead of
# Minestom's DynamicChunk (US-3.06 of docs/superpowers/specs/2026-08-01-falco-instance-chunk-design.md).
# `final` is a real break: anyone who subclassed it no longer can. It is deliberate -- the light
# engine and the chunk lifecycle had to end up on one instance, which is what the whole storage
# rewrite was for -- and admissible because the package documents every public type in it as
# experimental.
#
# japicmp additionally reports `setBlock(int, int, int, Block, BlockHandler$Placement,
# BlockHandler$Destroy)` and `tick(long)` as removed. Both are wrong. The methods are still public on
# FalcoChunk and callers keep them by inheritance; japicmp cannot see that because FalcoChunk lives
# in another module and `ignoreMissingClasses` is on, so an inherited member looks removed. Verified
# with `javap -p` on falco-instance's FalcoChunk.class -- both are `public` there.
falco-light.classExcludes = net.onelitefeather.falco.light.FalcoLightingChunk
